<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">DooN — DO:ON</title>
  <desc id="desc">Two connected luminous circles represent Doo and an AI system switching on together.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0A1024"/>
      <stop offset="1" stop-color="#120A2D"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#E6FCFF"/>
      <stop offset="0.3" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#F4F0FF"/>
      <stop offset="0.3" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="36" fill="url(#panel)"/>
  <rect width="1200" height="280" rx="36" fill="url(#grid)"/>

  <g transform="translate(74 44)">
    <path d="M16 96H46M146 96H176" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="82" cy="96" r="48" fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="18" filter="url(#glow)"/>
    <circle cx="82" cy="96" r="42" fill="#08182B" stroke="url(#cyanGlow)" stroke-width="8"/>
    <circle cx="130" cy="96" r="48" fill="none" stroke="#A78BFA" stroke-opacity="0.18" stroke-width="18" filter="url(#glow)"/>
    <circle cx="130" cy="96" r="42" fill="#100B29" stroke="url(#violetGlow)" stroke-width="8"/>
    <circle cx="106" cy="86" r="4.5" fill="#E0F2FE" filter="url(#glow)"/>
    <circle cx="106" cy="106" r="4.5" fill="#DDD6FE" filter="url(#glow)"/>
    <path d="M82 74V96" stroke="#E6FCFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M69 84a18 18 0 1 0 26 0" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="310" y="150" fill="#F8FAFC" font-size="108" font-weight="760" letter-spacing="8">DO</text>
    <circle cx="497" cy="110" r="7" fill="#67E8F9"/>
    <circle cx="497" cy="142" r="7" fill="#A78BFA"/>
    <text x="525" y="150" fill="url(#signal)" font-size="108" font-weight="760" letter-spacing="8">ON</text>
    <text x="314" y="202" fill="#94A3B8" font-size="22" font-weight="520" letter-spacing="5">DOO'S PERSONAL AI SKILL SYSTEM</text>
  </g>

  <g transform="translate(1032 140)" fill="none" stroke="url(#signal)" stroke-linecap="round">
    <circle r="42" stroke-width="2" opacity="0.42"/>
    <circle r="25" stroke-width="3" opacity="0.72"/>
    <path d="M0-20V-2" stroke-width="5"/>
    <path d="M-14-11a20 20 0 1 0 28 0" stroke-width="5"/>
  </g>
</svg>
